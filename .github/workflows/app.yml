# macOS app: generates the Xcode project with XcodeGen, builds PixelOpenSpace.app (Debug, unsigned), checks the
# embedded pixel-hook helper, and publishes the zipped app and the build log.
name: App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PixelOpenSpace.app
    # Xcode 26 is required: SwiftTerm (main) and Core/Package.swift need swift-tools 6.2.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (Debug, unsigned)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          if command -v xcbeautify >/dev/null 2>&1; then
            beautify() { xcbeautify --renderer github-actions; }
          else
            beautify() { cat; }
          fi
          xcodebuild \
            -project PixelOpenSpace.xcodeproj \
            -scheme PixelOpenSpace \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log | beautify

      - name: Check the embedded pixel-hook helper
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app="$(find build/DerivedData/Build/Products/Debug -maxdepth 1 -name '*.app' -print | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::No .app in build/DerivedData/Build/Products/Debug"
            exit 1
          fi
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          hook="$app/Contents/Helpers/pixel-hook"
          if [ ! -x "$hook" ]; then
            echo "::error::pixel-hook is missing: $hook"
            find "$app/Contents" -maxdepth 2 | head -n 50
            exit 1
          fi
          file "$hook"
          unset PIXEL_AGENT_ID PIXEL_HOOK_TOKEN PIXEL_HOOK_SOCKET PIXEL_HOOK_DEBUG

          # pixel-hook contract (PROPOSITION 5.4): always exit 0, never print anything.
          check() {
            local label="$1" out code
            shift
            set +e
            out="$("$@" 2>&1)"
            code=$?
            set -e
            if [ "$code" -ne 0 ] || [ -n "$out" ]; then
              echo "::error::pixel-hook ($label): exit code $code, output: $out"
              exit 1
            fi
            echo "pixel-hook ($label): exit 0, no output"
          }
          check "empty stdin" "$hook" </dev/null
          printf '%s' '{"session_id":"ci","hook_event_name":"Stop","cwd":"/tmp"}' >"$RUNNER_TEMP/event.json"
          check "event, app not running" env PIXEL_HOOK_SOCKET="$RUNNER_TEMP/absent.sock" "$hook" \
            <"$RUNNER_TEMP/event.json"

      # Snapshot harness (step 3): the app on a temporary, isolated state, every scenario, then it quits by itself.
      # Informative only: the virtual machines have no real graphics acceleration (scenes may come out black); the
      # reference stays the core's software rendering.
      - name: Snapshot harness
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          status=0
          Tools/snapshot.sh build/snapshots all || status=$?
          tail -n 30 build/snapshots/report.txt || true
          exit "$status"

      - name: Upload the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots
          if-no-files-found: warn
          retention-days: 14

      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/PixelOpenSpace.app.zip

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: PixelOpenSpace-app
          path: build/PixelOpenSpace.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
